<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Mart Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="login-container">
        <div class="left-section">
            <img src="https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?q=80&w=600&auto=format&fit=crop" alt="Laundry Illustration">
        </div>
        
        <div class="right-section">
            <div class="form-wrapper">
                <h2>Hello Again!</h2>
                <p class="subtitle">Welcome back! we missed you!</p>
                
                <form action="#" method="POST">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Emailid@site.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>
                    
                    <a href="#" class="forgot-link">Forgot Password</a>
                    
                    <button type="submit" class="login-btn">Login</button>
                </form>
                
                <p class="register-text">Not a member? <a href="#">Register Now</a></p>
            </div>
        </div>
    </div>

</body>
</html>
